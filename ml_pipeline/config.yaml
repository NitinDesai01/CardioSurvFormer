data:
  raw_path: "../data/raw/heart_failure_clinical_records_dataset.csv"
  processed_path: "../data/processed/"
  test_size: 0.15
  val_size: 0.15
  random_state: 42

models_dir: "../models/"

catboost:
  iterations: 1000
  learning_rate: 0.05
  depth: 6
  l2_leaf_reg: 3
  random_seed: 42

tabtransformer:
  embedding_dim: 64
  num_heads: 4
  num_layers: 3
  ff_dim: 128
  dropout: 0.1
  batch_size: 64
  learning_rate: 0.001
  num_epochs: 100

hybrid:
  catboost_dim: 64
  transformer_dim: 64
  hidden_dim: 64
  num_heads: 4
  dropout: 0.1
  learning_rate: 0.0005
  num_epochs: 100