version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cardiosurvformer_db
    environment:
      POSTGRES_USER: cardiosurv
      POSTGRES_PASSWORD: cardiosurv123
      POSTGRES_DB: cardiosurvformer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardiosurv"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cardiosurv_network

  redis:
    image: redis:7-alpine
    container_name: cardiosurvformer_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cardiosurv_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cardiosurvformer_backend
    environment:
      DATABASE_URL: postgresql://cardiosurv:cardiosurv123@postgres:5432/cardiosurvformer
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./ml_pipeline/models:/app/models
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - cardiosurv_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cardiosurvformer_frontend
    environment:
      API_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - ./data:/app/data
    networks:
      - cardiosurv_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  cardiosurv_network:
    driver: bridge